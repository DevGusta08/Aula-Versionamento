<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../public/style.css">
    <title>Semana 15 - Aula 2</title>
</head>
<body>
    <div class="caixa-maior">
        <div class="titulo">
            <h3>Login</h3>            
        </div>
        <div class="caixa-usuario">
            <label for="username">Usuário:</label>
            <input type="text" id="usuario" placeholder="Digite seu usuário" required>
        </div>
        <div class="caixa-senha">
            <label for="password">Senha:</label>
            <input type="password" name="" id="senha" placeholder="Digite a senha" required>
            
        </div>
        <div class="button-create">
            <button type="submit" class="botao">Login</button>
            <a href="">Criar conta</a>
        </div>
    </div>
</body>
</html>
